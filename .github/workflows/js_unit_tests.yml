name: JS Unit Tests

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - release-*
    paths:
      - gcs/**
  pull_request:
    branches:
      - main
      - release-*
    paths:
      - gcs/**

jobs:
  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gcs

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn

      - name: Run unit tests
        run: yarn test:unit
